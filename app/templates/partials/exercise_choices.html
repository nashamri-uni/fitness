<div class="exercise-options">
  {% for exercise in exercises %}
    <div class="exercise-option">
      <input
        type="radio"
        id="id_exercise_{{ exercise.pk }}"
        name="{{ add_form.exercise.html_name }}"
        value="{{ exercise.pk }}"
        {% if selected_exercise_id == exercise.pk|stringformat:"s" %}checked{% endif %}
        {% if add_form.exercise.errors %}aria-invalid="true" aria-describedby="exercise-errors"{% endif %}
        required
      >
      <label for="id_exercise_{{ exercise.pk }}">
        {% if exercise.local_thumbnail_url %}
          <img class="exercise-thumbnail exercise-thumbnail--picker" src="{{ exercise.local_thumbnail_url }}" alt="" width="320" height="320" loading="lazy" decoding="async">
        {% endif %}
        <span>{{ exercise.display_name }}</span>
      </label>
    </div>
  {% endfor %}
</div>
